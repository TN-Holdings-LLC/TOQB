[project]
name = "toqb"
version = "0.1.0"
description = "Task-Oriented Quantum Benchmark: time-budgeted, calibration-split evaluation of quantum compilers"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy", "qiskit>=2.0"]

[project.optional-dependencies]
fake = ["qiskit-ibm-runtime"]
tket = ["pytket", "pytket-qiskit"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["toqb"]
